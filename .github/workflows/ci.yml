# 持续集成：每次推送和 PR 自动跑与本地同一套命令（每条 run 命令都取自 AGENTS.md「命令」一节）。
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 本机版：装依赖 → 语法检查 → 代码形状 → ruff → 本机版全量 → Node 离线测试，一步失败整个 job 失败
  local-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r local/requirements.txt
      - run: python -m pip install -r local/requirements-advanced-ocr.txt
      - run: python -m pip install -r local/requirements-advanced-phone.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall local server
      - run: ls local/ui/*.js local/ui/*/*.js | xargs -n 1 node --check
      - run: python tools/code_shape/check.py
      - run: ruff check local server tools
      - run: python -m unittest discover -s local/tests -p "test_*.py" -v
      - run: node server/bot/test_bot_runtime.js
      - run: node server/bot/test_handled_messages.js
      - run: node server/deploy/test_atomic_json.js

  # 服务器版：pytest server/tests；不装浏览器、不联学校
  server-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pip install pytest
      - run: python -m pytest server/tests
