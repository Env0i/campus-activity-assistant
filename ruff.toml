# ruff 配置：只查语法错误与 pyflakes 两类问题，不查格式，也不做自动修复。
# 只开 E9 与 F：E9 是语法错误，F 是 pyflakes（未使用、未定义、重复定义）。样式类规则留到以后的批次；
# ruff format 也不用，避免一次重排大批存量代码。
target-version = "py310"

# 这些目录不查：文档、构建产物、本地数据、第三方依赖与工具缓存。
exclude = [
    "design/",
    "docs/",
    "dist/",
    ".claude/",
    "local/data/",
    "server/data/",
    "local/bin/",
    "node_modules/",
]

[lint]
select = ["E9", "F"]

# 存量名单：这些文件里已经存在的告警暂时保留，按「文件、规则码」精确到项。
# 只减不增：新代码不许加项；确实需要时先问用户，别为了变绿把新告警塞进来。
[lint.per-file-ignores]
